<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pactio · Acuerdos Digitales Transparentes</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              serif: ['Newsreader', 'serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              midnight: {
                950: '#070C18',
                900: '#0B1120',
                800: '#151F32',
                700: '#1E293B',
              },
              cobalt: {
                500: '#3B82F6',
                600: '#2563EB',
                700: '#1D4ED8',
              },
              emerald: {
                500: '#10B981',
                600: '#059669',
              },
              paper: {
                50: '#FAF8F5',
                100: '#F4EFEA',
                200: '#E8DFD5',
                800: '#2C2825',
                900: '#1C1917',
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom scrollbars and paper styling */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(156, 163, 175, 0.4);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(156, 163, 175, 0.7);
      }
      .paper-shadow {
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(0, 0, 0, 0.08);
      }
      .paper-shadow-warm {
        box-shadow: 0 20px 40px -15px rgba(60, 45, 30, 0.15), 0 0 0 1px rgba(60, 45, 30, 0.08);
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
